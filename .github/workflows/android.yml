name: Build Bitfox for Android ARM64 (NEON)

on:
  workflow_dispatch:
  push:
    paths:
      - 'engine/**'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - 'tools/check_project.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - 'tools/check_project.py'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Android ARM64 (NEON)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify project and embedded NNUE
        run: python3 tools/check_project.py

      - name: Install Rust toolchain and Android target
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add --toolchain 1.96.0 aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager --sdk_root="$sdk_root" --install "ndk;27.2.12479018"
          ndk_home="$sdk_root/ndk/27.2.12479018"
          test -x "$ndk_home/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

      - name: Build Android ARM64 NEON engine
        run: make android-arm64

      - name: Verify Android binary
        run: |
          test -s release/bitfox-arm64-android-neon
          file release/bitfox-arm64-android-neon
          readelf -h release/bitfox-arm64-android-neon | grep -E 'Class:|Machine:'

      - name: Upload Android ARM64 engine
        uses: actions/upload-artifact@v4
        with:
          name: bitfox-android-arm64-neon
          path: release/bitfox-arm64-android-neon
          if-no-files-found: error
